# Shared gate rules for every project. Read by gate.py and merged with the
# project's reviewers/gates.toml, tighten-only: a project may add reviewers,
# checks and risky files, or lower a tier or size limit, but never remove a
# shared reviewer or loosen those limits. base, max_usd and [caps] are the
# project's to set. The flow these rules drive is in the kit's core/rules/DEV_FLOW.md.
version = 1
base = "main"
max_usd = 0.0              # real-run budget per gate run; 0 = real checks are skipped and reported unverified
report_kinds = ["mechanical", "unit", "dry-run", "ui", "real", "review"]   # what "How it was tested" reports on
exclude_paths = ["reviewers/calibration/**"]   # planted-defect fixtures: never shown to reviewers; shared-only key

[globs]
code = ["**/*.py", "**/*.ts", "**/*.tsx", "**/*.js", "**/*.go", "**/*.rs", "**/*.sh"]
# Where stored data and its queries usually live. A project appends its own paths under [globs] data.
data = ["**/*.sql", "**/migrations/**", "**/alembic/**", "**/*.prisma", "**/schema.rb", "**/*.graphql",
        "**/models.py", "**/models/**", "**/schema.py", "**/schemas/**", "**/entities/**",
        "**/db/**", "**/database/**", "**/queries/**", "**/repositories/**", "**/repository/**", "**/dao/**",
        "**/crud.py", "**/*_repo.py", "**/*_repository.py", "**/*_dao.py"]
# Test code. A reviewer with `rerun_skip = ["@tests"]` is not re-run, once clean, when only these changed.
tests = ["tests/**", "test/**", "**/test_*.py", "**/*_test.py", "**/conftest.py", "**/*.test.*", "**/*.spec.*",
         "**/__tests__/**"]

[caps]                     # attempts per step before the flow stops and asks you
plan_rounds = 2
review_rounds = 5          # per reviewer: only the reviewers that failed a round use an attempt
check_rounds = 3
push_rounds = 2

[commit]                   # hygiene H1-H5, run by the hook on every git commit
junk_patterns = ["**/scratch*/**", "**/tmp/**", "**/*.log", "**/*.tmp", "**/*.bak", "**/*.orig", "**/*.rej", "**/__pycache__/**", "**/.ipynb_checkpoints/**", "**/.DS_Store", "**/*.pyc"]
scratch_markers = ["/tmp/claude-", "/scratchpad/"]
max_file_kb = 500

[push]
forbid_paths = [".claude/**", ".env", ".env.*", "**/*.pem", "**/id_rsa*"]
template_suffixes = [".example", ".sample", ".template"]   # a tracked `.env.example` is a template, not a secret
secret_patterns = ["AKIA[0-9A-Z]{16}", "sk-[A-Za-z0-9_-]{20,}", "-----BEGIN [A-Z ]*PRIVATE KEY-----", "glpat-[A-Za-z0-9_-]{20}"]

[baseline]                 # how a check re-runs on a clean origin/<base> worktree (lazy baseline, freshness)
link = []                  # paths symlinked from this worktree into the temp one, e.g. [".venv"]
env = {}                   # extra env for the temp run; "{root}" is the temp worktree

[tiers.lite]
max_changed_lines = 40
paths = ["**/*.md", "docs/**"]
python_ast_neutral = true

[tiers.standard]
max_changed_lines = 300

[tiers.full]
always_when = []

# Shared reviewers. Each is the kit's core/reviewers/<id>.md. Default tiers: standard, full.
# rerun_skip: once a reviewer is clean, a change only to these paths does not re-run it. Every reviewer but
# `tests` skips test-only changes; a reviewer with open findings always re-runs to check its fixes.
# exclude: files the reviewer is never shown (its lens exempts them), e.g. tests for the code-only lenses.
# stage: a label only; every code reviewer runs in the same round (`plan` is the plan gate's reviewer).
# model / model_by_tier name a model tier (light | standard | strong), not a model; each agent maps the tier.
# "light" for the pattern-matching lenses; deep-reasoning lenses keep the default (standard) or strong.
# A re-review runs at standard at most, whatever is named here.
[[shared]]
id = "plan"
stage = "plan"
applies_to = ["**"]

[[shared]]
id = "fidelity"
rerun_skip = ["@tests"]
stage = "logic"
applies_to = ["**"]

[[shared]]
id = "correctness"
rerun_skip = ["@tests"]
stage = "logic"
applies_to = ["@code"]
model_by_tier = { full = "strong" }

[[shared]]
id = "polish"              # lean + conventions + magic-values in one pass
rerun_skip = ["@tests"]
exclude = ["@tests"]
stage = "quality"
applies_to = ["@code"]

[[shared]]
id = "docs-drift"
rerun_skip = ["@tests"]
stage = "quality"
applies_to = ["**"]
tiers = ["lite", "standard", "full"]

[[shared]]
id = "tests"
stage = "quality"
applies_to = ["@code"]

[[shared]]
id = "data-schema"
rerun_skip = ["@tests"]
exclude = ["@tests"]
stage = "quality"
applies_to = ["@data"]
model = "light"

# Used only when a project declares no [[checks]] of its own.
[[checks]]
id = "unit"
kind = "unit"
when = ["**/*.py"]
run = ".venv/bin/python -m pytest -q"
